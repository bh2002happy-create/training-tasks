
<!DOCTYPE html>
<html>
<head>
    <title>Highlight List</title>
    
    <style>
        body {
    font-family: Arial;
    text-align: center;
    padding: 50px;
}

ul {
    list-style: none;
    padding: 0;
    width: 300px;
    margin: auto;
}

li {
    background-color: #eee;
    padding: 15px;
    margin-bottom: 5px;
    cursor: pointer;
}

.active {
    background-color: #6C63FF;
    color: white;
}
h1 {
    text-align: center;
    color: #6C63FF;
    font-size: 28px;
    margin-bottom: 10px;
}

p {
    text-align: center;
    color: #777;
    font-size: 16px;
}
    </style>
</head>
<body>
    <h1>Web Technologies</h1>
<p>Explore the basics of web development</p>
    <ul id="myList">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>jQuery</li>
    </ul>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function() {

    $("#myList li").click(function() {

        $("#myList li").removeClass("active");

        $(this).addClass("active");

    });

});
    </script>
</body>
</html>
