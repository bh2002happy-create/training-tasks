<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>
        <link rel="stylesheet" href="style.css">

        <style>
            body {
    background-color: #ddd;
    font-family: Arial, sans-serif;
}

.profile-card {
    width: 280px;
    height: 350px;
    margin: 60px auto;
    padding: 30px;
    background-color: white;
    text-align: center;
    border-radius: 70px;
    box-shadow: 0 5px 15px #aaa;
}

.profile-image {
    width: 100px;
    height: 100px;
    border-radius: 50%;
}

.profile-card h1 {
    font-size: 24px;
    margin: 25px 0 15px;
}

.profile-card h3 {
    color: #999;
    font-size: 16px;
    margin: 0 0 20px;
}

.profile-card p {
    font-size: 16px;
    line-height: 1.5;
}


.social-icons {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 20px;
}

.social-icons img {
    width: 30px;
    height: 30px;
}
        </style>



</head>
<body>
     <div class="profile-card">

        <img class="profile-image" src="images/profile.png">

        <h1>Rania Alzaeem</h1>

        <h3>Front End developer</h3>

        <p>
            Passionate about clean code, great
            UI/UX, and web performance
        </p>

        <div class="social-icons">

            <a href="#">
                <img src="images/linkedin.png">
            </a>

            <a href="#">
                <img src="images/github.png">
            </a>

            <a href="#">
                <img src="images/x.png">
            </a>

        </div>

    </div>


</body>
</html>
