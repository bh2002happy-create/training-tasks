<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Personal Page</title>
        <link rel="stylesheet" href="style.css">
        
        <style>
body {
    margin: 0;
    background-color: #eeeeff;
    font-family: Arial, sans-serif;
}


.container {
    width: 500px;
    background-color: white;

    margin: 30px auto;
    padding: 15px;

    border: 2px solid #c8c5f2;
    border-radius: 12px;

    box-sizing: border-box;

    display: flex;
    flex-direction: column;
    align-items: center;
}


.container h1 {
    width: 100%;

    background-color: #e8e6ff;
    color: #17145c;

    text-align: center;

    font-size: 28px;

    padding: 12px 0;

    margin: 0 0 25px;

    border-radius: 7px;
}


.container img {
    width: 130px;
    height: 130px;

    border-radius: 50%;

    border: 2px solid #b9b5f5;

    object-fit: cover;

    margin-bottom: 15px;
}


.container h2 {
    color: #17145c;

    font-size: 27px;

    margin: 5px 0;
}


.container h3 {
    color: #5149a5;

    font-size: 18px;

    margin: 0 0 15px;
}


.container > p {
    text-align: center;

    color: #30345f;

    font-size: 16px;

    line-height: 1.6;

    margin: 0 0 15px;
}


.section {
    width: 100%;

    margin-top: 15px;
}


.section h4 {
    background-color: #e8e6ff;

    color: #17145c;

    font-size: 19px;

    padding: 8px 15px;

    margin: 0;

    border-radius: 7px;
}


.section ul {
    width: 100%;

    color: #30345f;

    line-height: 1.8;

    margin: 10px 0;
}


button {
    width: 140px;
    height: 40px;

    margin: 20px 0;

    background-color: #6357f5;

    color: white;

    border: none;

    border-radius: 7px;

    font-size: 16px;

    font-weight: bold;
}


hr {
    width: 100%;

    border: none;
    border-top: 1px solid #c9c7e8;

    margin: 0;
}


.copyright {
    color: #30345f;

    font-size: 14px;

    margin: 10px 0 5px;
}




        </style>

</head>
<body>
      <div class="container">
        <h1>My Personal Page</h1>

        <h2>Rania Alzaeem</h2>
        <h3>Web Developer</h3>
        <img src="images/Personal.png">
        <p>
            Hello! My name is Rania.<br>
            I am learning HTML and CSS.
        </p>

          <div class="section">
             <h4>My Skills</h4>
                    <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>
        </div>

               <div class="section">
            <h4>My Hobbies</h4>

            <ul>
                <li>Reading</li>
                <li>Learning</li>
                <li>Programming</li>
            </ul>
        </div>

          <button>Contact Me</button>
           <p class="copyright">
            © 2026 Rania
        </p>



          </div>




      </div>

</body>
</html>
