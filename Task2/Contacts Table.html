<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contacts Table</title>
      <link rel="stylesheet" href="style.css">
</head>

<style>
body {
    background-color: black;
    font-family: Arial, sans-serif;
}

table {
    width: 620px;
    margin: 35px auto;
    background-color: white;
    border-collapse: collapse;
}

th {
    background-color: #4dbd00;
    color: white;
    text-align: left;
    padding: 8px;
    font-weight: normal;
}

td {
    padding: 8px;
    border: 1px solid #ccc;
}


tr:nth-child(even) {
    background-color: #eeeeD8;
}


input {
    width: 15px;
    height: 15px;
}

td img {
    width: 30px;
    height: 20px;
        object-fit: cover;
}

</style>
<body>
    <table>
          <thead>
            <tr>
                <th>Contact name</th>
                <th>City</th>
                <th>Country</th>
                <th>Is Promoted</th>
            </tr>
        </thead>

          <tbody>


            <tr>
                <td>Maria Anders</td>
                <td>Berlin</td>
<td>
    <img src="images/Germany.jpg">
    Germany
</td>
                <td><input type="checkbox"></td>
            </tr>

            <tr>
                <td>Ana Trujillo</td>
                <td>México D.F.</td>
<td>
    <img src="images/Mexico.jpg">
    Mexico
</td>
                <td><input type="checkbox"></td>
            </tr>

             <tr>
                <td>Antonio Moreno</td>
                <td>México D.F.</td>
           <td>
    <img src="images/Mexico.jpg">
    Mexico
</td>
                <td><input type="checkbox" checked></td>
            </tr>

            <tr>
                <td>Thomas Hardy</td>
                <td>London</td>
  <td>
    <img src="images/UK.jpg">
    UK
</td>
                <td><input type="checkbox"></td>
            </tr>
        </tbody>
   
    </table>
</body>
</html>
